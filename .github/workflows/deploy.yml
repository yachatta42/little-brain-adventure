name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compressed site bundle
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          prefix = 'window.APP_GZIP=(window.APP_GZIP||"")+"'
          pieces = []
          for i in range(1, 6):
              source = Path(f'payload-{i}.js').read_text(encoding='utf-8')
              if not source.startswith(prefix) or not source.endswith('";\n'):
                  raise SystemExit(f'Payload {i}: invalid wrapper')
              pieces.append(source[len(prefix):-3])
          compressed = base64.b64decode(''.join(pieces), validate=True)
          html = gzip.decompress(compressed).decode('utf-8')
          question_ids = re.findall(r"id:'[^']+'", html)
          assert '<!doctype html>' in html.lower(), 'Missing HTML document'
          assert '小小腦力探險隊' in html, 'Missing site title'
          assert len(question_ids) >= 100, f'Question bank unexpectedly small: {len(question_ids)}'
          Path('site-source.html').write_text(html, encoding='utf-8')
          print(f'Bundle OK: {len(html):,} HTML characters; {len(question_ids)} question IDs.')
          PY
      - name: Save editable source in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-source.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add editable site source'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
