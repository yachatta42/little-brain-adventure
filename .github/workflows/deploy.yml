name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify site and question bank
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          ids = re.findall(r"id:'([a-z]\\d+)',level:", html)
          assert '<!doctype html>' in html.lower(), 'Missing HTML document'
          assert '小小腦力探險隊' in html, 'Missing site title'
          assert len(ids) == 160, f'Expected 160 questions, found {len(ids)}'
          assert len(set(ids)) == len(ids), 'Question IDs must be unique'
          for prefix, category in {'l':'語文表達','m':'數學推理','p':'觀察與規律','g':'分類與邏輯','s':'生活與空間','x':'空間推理','d':'資料判讀','c':'自然探究'}.items():
              count = sum(q.startswith(prefix) for q in ids)
              assert count == 20, f'{category}: expected 20 questions, found {count}'
          assert html.count("type:'open'") <= 1, 'Too many open-answer questions'
          print('Site OK: 160 unique questions; 20 questions in each of 8 categories.')
          PY
          mkdir -p dist
          cp index.html dist/index.html
          cp .nojekyll dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
