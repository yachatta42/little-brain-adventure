name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify site and question bank
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          ids = re.findall(r"id:'([a-z]\d+)',level:", html)
          assert '<!doctype html>' in html.lower(), 'Missing HTML document'
          assert '小小腦力探險隊' in html, 'Missing site title'
          assert len(ids) == 250, f'Expected 250 questions, found {len(ids)}'
          assert len(set(ids)) == len(ids), 'Question IDs must be unique'
          expected = {'l':40,'m':30,'p':30,'g':30,'s':30,'x':30,'d':30,'c':30}
          names = {'l':'語文表達','m':'數學推理','p':'觀察與規律','g':'分類與邏輯','s':'生活與空間','x':'空間推理','d':'資料判讀','c':'自然探究'}
          for prefix, expected_count in expected.items():
              count = sum(q.startswith(prefix) for q in ids)
              assert count == expected_count, f'{names[prefix]}: expected {expected_count} questions, found {count}'
          assert html.count("type:'open'") <= 1, 'Too many open-answer questions'
          assert 'function availablePool(' in html and 'saved.masteredQuestions.push(q.id)' in html, 'Mastered-question exclusion is missing'
          print('Site OK: 250 unique questions; category counts and mastered-question tracking verified.')
          PY
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.rfind('<script>') + len('<script>')
          end = html.rfind('</script>')
          Path('site-check.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check site-check.js
          mkdir -p dist
          cp index.html dist/index.html
          cp .nojekyll dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
